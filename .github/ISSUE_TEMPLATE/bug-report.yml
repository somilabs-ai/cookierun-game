name: 버그 발견
description: 기대와 다르게 동작하는 것을 알려 주세요. 검토한 뒤 고칠 계획에 넣습니다.
title: "[버그 발견] "
labels: ["status:triage", "버그 발견"]
body:
  - type: markdown
    attributes:
      value: |
        이 양식은 **외부 접수**입니다. 등록하면 `status:triage` 와 `버그 발견` 라벨이 붙고 자동으로 실행되지 않습니다.
        검토해서 고치기로 하면 마일스톤을 붙여 개발 task 로 바꿉니다.
  - type: textarea
    id: observed
    attributes:
      label: 본 것
      description: 실제로 무엇이 일어났나요? 오류 문구·화면 캡처가 있으면 붙여 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 것
      description: 원래 어떻게 되어야 한다고 생각했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 같은 일을 다시 일으키는 순서를 적어 주세요.
      placeholder: |
        1. ○○ 화면에 들어간다
        2. ○○ 버튼을 누른다
        3. ○○ 가 나타난다
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      description: 기기·브라우저·앱 버전, 시각 등 아는 만큼.
      placeholder: "예: iPhone 15 Safari, 2026-11-16 14:00"
    validations:
      required: false
